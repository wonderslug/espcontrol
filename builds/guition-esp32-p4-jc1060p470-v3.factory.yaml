# Factory build for the JC1060P470 V3 production-silicon panel.
substitutions:
  firmware_version: "0.0.0"
  espcontrol_component_url: "file:///config"
  icon_font_file: "/config/common/assets/fonts/espcontrol-icons.ttf"
  espcontrol_component_ref: "HEAD"

packages:
  core: !include guition-esp32-p4-jc1060p470-v3.yaml
  api_encryption: !include ../common/addon/api_encryption_dynamic.yaml

esphome:
  project:
    name: wonderslug.espcontrol
    version: "${firmware_version}"

dashboard_import:
  package_import_url: github://wonderslug/espcontrol/devices/guition-esp32-p4-jc1060p470-v3/esphome.yaml@main
